name: Self-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  yaml-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate YAML files
        run: |
          python -c "
          import yaml, glob, sys
          ok = True
          for p in glob.glob('**/*.y*ml', recursive=True):
              try:
                  with open(p) as f:
                      yaml.safe_load(f)
                  print(f'ok: {p}')
              except Exception as e:
                  print(f'FAIL: {p}: {e}'); ok = False
          sys.exit(0 if ok else 1)
          "

  compose-up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bring up infra
        run: docker compose -f compose/docker-compose.yml up -d
      - name: Wait for healthy
        run: bash scripts/healthcheck.sh
      - name: Tear down
        if: always()
        run: docker compose -f compose/docker-compose.yml down

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck on scripts/
        run: |
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh
