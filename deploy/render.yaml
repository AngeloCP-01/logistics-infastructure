# Render Blueprint for the AI Logistics Platform.
# Each service is added to this file during its own implementation phase.
# Phase 0 ships only the gateway placeholder (commented) so the file is valid.

services:
  - type: web
    name: logistics-gateway
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /readyz
    autoDeploy: true
    dockerCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: GATEWAY_PORT
        value: "10000"
      - key: JWT_SECRET
        sync: false
      - key: SERVICE_JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AUTH_SERVICE_URL
        value: http://logistics-auth-service:8080
      - key: USER_SERVICE_URL
        value: http://logistics-user-service:8080
      - key: TRACKING_SERVICE_URL
        value: http://logistics-tracking-service:8080
      - key: GATEWAY_CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info

# Future services (filled in their respective phases):
#  - auth-service
#  - user-service
#  - order-service
#  - dispatch-service
#  - tracking-service
#  - notification-service
#  - ai-service
